# Include this inside the public HTTP (or HTTPS) server block.  The upstream
# binds only to loopback; nginx owns the public listener and optional HTTP
# Basic authentication.  The chosen public scheme is forwarded explicitly.
location = /harness {
    return 302 /harness/agent-runtime;
}

location ^~ /harness/ {
    # Executable packages are local-admin only, even after Basic login.  The
    # runtime GET is metadata; writes require direct loopback / SSH tunnel.
    if ($uri ~ "^/harness/api/local/external-skills/(?!runtime$)") { return 403; }
    client_max_body_size 25m;
    # On Ubuntu, make this file root:www-data mode 0640 so nginx workers can
    # read the password hash without granting other users access.
    auth_basic "HarnessAgent";
    auth_basic_user_file /etc/nginx/.htpasswd-harnessagent;

    # The application intentionally accepts only local upstream hosts.  Avoid
    # forwarding external Origin, because nginx is the same-origin boundary.
    proxy_pass http://127.0.0.1:8765/;
    proxy_set_header Host 127.0.0.1:8765;
    proxy_set_header Origin "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /harness;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
