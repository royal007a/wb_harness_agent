# Include this inside the existing HTTPS server block.  The upstream binds only
# to loopback; nginx owns public TLS and optional HTTP Basic authentication.
location = /harness {
    return 302 /harness/agent-runtime;
}

location ^~ /harness/ {
    # On Ubuntu, make this file root:www-data mode 0640 so nginx workers can
    # read the password hash without granting other users access.
    auth_basic "HarnessAgent";
    auth_basic_user_file /etc/nginx/.htpasswd-harnessagent;

    # The application intentionally accepts only local upstream hosts.  Avoid
    # forwarding external Origin, because nginx is the same-origin boundary.
    proxy_pass http://127.0.0.1:8765/;
    proxy_set_header Host 127.0.0.1:8765;
    proxy_set_header Origin "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
