# Independent hostname: DSH uses root-relative URLs; do not share support's API root.
# Uses the existing host certificate and Basic user file. Certificate trust is unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name dsh.118.196.123.132.nip.io;
    return 308 https://dsh.118.196.123.132.nip.io$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dsh.118.196.123.132.nip.io;
    ssl_certificate /data/certs/self.crt;
    ssl_certificate_key /data/certs/self.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    auth_basic "HarnessAgent";
    auth_basic_user_file /etc/nginx/.htpasswd-harnessagent;
    location = / { return 302 /dsh; }
    location ^~ /api/local/external-skills/ { return 403; }
    location / {
        proxy_pass http://127.0.0.1:8876;
        proxy_set_header Host 127.0.0.1:8876;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
