        const: text/event-stream
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    ReplanId:
      name: replanId
      in: path
      required: true
      schema:
        type: string
  schemas:
    FrameworkCatalog:
      $ref: './framework-catalog.schema.json'
    CreateTaskRequest:
      $ref: './core-contracts.schema.json#/$defs/task_create'
    CreateTaskResponse:
      $ref: './core-contracts.schema.json#/$defs/local_http_task_created'
    TaskView:
      $ref: './core-contracts.schema.json#/$defs/local_http_task_detail'
    EmptyObject:
      type: object
      additionalProperties: false
      description: Caller-supplied Plan, goal, resource, permissions, limits, Prompt and code are forbidden.
    ReplanList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: './local-replan.schema.json#/$defs/replan_created'
    ReplanDetail:
      type: object
      additionalProperties: false
      required: [attempt, candidate_plan, gaps]
      properties:
        attempt:
