          schema: {const: text/event-stream}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './local-agent-lab.schema.json#/$defs/send_message_request'}
      responses:
        '200':
          description: Ordered delta events followed by done; model/provider calls remain zero.
          content:
            text/event-stream:
              schema: {$ref: './local-agent-lab.schema.json#/$defs/stream_event'}
        default: {$ref: '#/components/responses/Error'}
  /local/agent-runtime/providers:
    servers: [{url: /api}]
