  /local/agent-lab/models:
    servers: [{url: /api}]
    get:
      operationId: listLocalAgentLabModels
      responses: {'200': {description: Local Model Profiles.}}
    post:
      operationId: createLocalAgentLabModel
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './local-agent-lab.schema.json#/$defs/model_create_request'}
