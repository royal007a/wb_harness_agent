      responses: {'200': {description: Zero-network provider readiness result.}, default: {$ref: '#/components/responses/Error'}}
  /local/agent-runtime/models:
    servers: [{url: /api}]
    get:
      operationId: listLocalAgentRuntimeModels
      responses: {'200': {description: Explicit local Model Profiles.}}
    post:
      operationId: createLocalAgentRuntimeModel
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
