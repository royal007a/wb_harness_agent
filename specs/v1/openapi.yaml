        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createNativeClaudeResearchRun
      description: Creates no state unless model, external-data and source-policy gates are all satisfied.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './claude-research-runtime.schema.json#/$defs/native_research_request'}
      responses:
        '202': {description: A Product Task plus native parent/Child Run tree accepted.}
        default: {$ref: '#/components/responses/Error'}
  /local/research-native/{runId}:
    servers: [{url: /api}]
    get:
      operationId: getNativeClaudeResearchRun
      parameters:
        - name: runId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: Parent/Child Run tree, SDK delegation events, artifacts and source evidence.}
        default: {$ref: '#/components/responses/Error'}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    ReplanId:
      name: replanId
      in: path
      required: true
      schema:
        type: string
  schemas:
    CreateTaskRequest:
      $ref: './core-contracts.schema.json#/$defs/task_create'
    CreateTaskResponse:
      type: object
      additionalProperties: false
      required: [task, initial_run, links]
      properties:
        task:
          $ref: './core-contracts.schema.json#/$defs/task'
        initial_run:
          $ref: './core-contracts.schema.json#/$defs/run'
        links:
          type: object
          additionalProperties: false
          required: [task, run, events]
          properties:
            task:
              type: string
            run:
              type: string
            events:
              type: string
    TaskView:
      type: object
      additionalProperties: false
      required: [task, latest_run]
      properties:
        task:
          $ref: './core-contracts.schema.json#/$defs/task'
        latest_run:
          oneOf:
            - $ref: './core-contracts.schema.json#/$defs/run'
            - type: 'null'
    EmptyObject:
      type: object
      additionalProperties: false
      description: Caller-supplied Plan, goal, resource, permissions, limits, Prompt and code are forbidden.
    ReplanList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: './local-replan.schema.json#/$defs/replan_created'
    ReplanDetail:
      type: object
      additionalProperties: false
      required: [attempt, candidate_plan, gaps]
      properties:
        attempt:
          $ref: './execution-control.schema.json#/$defs/replan_attempt'
        candidate_plan:
          $ref: './execution-control.schema.json#/$defs/plan_revision'
        gaps:
          type: array
          minItems: 1
          items:
            $ref: './execution-control.schema.json#/$defs/gap'
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
            request_id:
              type: string
            details:
              type: object
  responses:
    Error:
      description: Stable error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
