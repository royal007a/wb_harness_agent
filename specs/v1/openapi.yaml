    servers: [{url: /api}]
    post:
      operationId: registerNativeResearchPdf
      description: Registers only a bounded Public PDF. This endpoint never extracts or sends the document.
      parameters:
        - name: name
          in: query
          required: true
          schema: {type: string, minLength: 5, maxLength: 180}
      requestBody:
        required: true
        content:
          application/pdf:
            schema: {type: string, format: binary}
      responses:
        '201': {description: Registered resource metadata.}
