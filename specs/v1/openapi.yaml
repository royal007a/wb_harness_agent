    post:
      operationId: createResearchAgentSimulationRun
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './research-agent-runtime.schema.json#/$defs/research_agent_request'}
      responses:
        '202':
          description: A Task plus a parent Run whose Child Agents use only synthetic resources and resource.inspect.
