openapi: 3.1.0
info:
  title: HarnessAgent P0 API
  version: 0.1.0-draft
  description: Current local Product contracts plus explicitly marked future drafts. A documented future operation is not a registered runtime route.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getLocalLiveness
      description: Static local liveness; not Provider readiness, usage telemetry or release identity.
      responses:
        '200':
          description: Local process response.
          content:
            application/json:
              schema: {$ref: './core-contracts.schema.json#/$defs/local_http_health'}
        default: {$ref: '#/components/responses/LocalProductError'}
  /resources:
    get:
      operationId: listLocalResources
      responses:
        '200':
          description: Newest registrations first; metadata only.
          content:
            application/json:
              schema: {$ref: './core-contracts.schema.json#/$defs/local_http_resource_list'}
        default: {$ref: '#/components/responses/LocalProductError'}
    post:
      operationId: registerLocalCsv
      parameters:
        - name: name
          in: query
          required: false
          schema: {type: string, default: data.csv}
      requestBody:
        required: true
        content:
          '*/*':
            schema: {type: string, format: binary}
      responses:
        '201':
          description: CSV registration metadata, deduplicated by content.
          content:
            application/json:
              schema: {$ref: './core-contracts.schema.json#/$defs/local_http_resource'}
        default: {$ref: '#/components/responses/LocalProductError'}
  /resources/{resourceId}:
    get:
      operationId: getLocalResource
      parameters:
        - name: resourceId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Local resource metadata, never raw content.
          content:
            application/json:
              schema: {$ref: './core-contracts.schema.json#/$defs/local_http_resource'}
        default: {$ref: '#/components/responses/LocalProductError'}
  /local/sample:
    servers: [{url: /api}]
    get:
      operationId: downloadLocalCsvSample
      responses:
        '200':
          description: Versioned sample bytes; reading does not register a resource.
          headers:
            Content-Disposition: {schema: {type: string}}
          content:
            text/csv:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/LocalProductError'}
  /local/tasks:
    servers: [{url: /api}]
    post:
      operationId: createLocalQuickTask
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [resource_id, objective]
              properties:
                resource_id: {type: string}
                objective: {type: string, minLength: 1, maxLength: 2000}
                timeout_seconds: {type: integer, minimum: 1, maximum: 300}
      responses:
        '202':
          description: Local Task and initial Run, no links field.
          content:
            application/json:
              schema: {$ref: './core-contracts.schema.json#/$defs/local_http_task_created'}
        default: {$ref: '#/components/responses/LocalProductError'}
  /runs/{runId}/artifacts:
    get:
      operationId: listRunArtifacts
      parameters: [{$ref: '#/components/parameters/RunId'}]
      responses:
        '200':
          description: Artifact metadata in insertion order.
          content:
            application/json:
              schema: {$ref: './core-contracts.schema.json#/$defs/local_http_artifact_list'}
        default: {$ref: '#/components/responses/LocalProductError'}
  /tasks/{taskId}/artifacts:
    get:
      operationId: listTaskArtifacts
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '200':
          description: Artifacts across this Task's Runs.
          content:
            application/json:
              schema: {$ref: './core-contracts.schema.json#/$defs/local_http_artifact_list'}
        default: {$ref: '#/components/responses/LocalProductError'}
  /artifacts/{artifactId}/content:
    get:
      operationId: downloadArtifactContent
      parameters:
        - name: artifactId
          in: path
          required: true
          schema: {type: string}
        - name: download
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Raw bytes using the Artifact media_type; no JSON envelope.
          headers:
            Content-Disposition: {schema: {type: string}}
          content:
            '*/*':
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/LocalProductError'}
  /frameworks:
    get:
      operationId: listFrameworkCatalog
      description: Returns explicit framework selection metadata. This endpoint is read-only and never enables a runtime or performs external calls.
      responses:
        '200':
          description: Framework catalog with adapter status and control-plane boundary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameworkCatalog'
        default:
          $ref: '#/components/responses/Error'
  /local/external-skills/runtime:
    servers:
      - url: /api
    get:
      operationId: getExternalSkillRuntime
      description: Returns the default-closed external Skill gate and isolation profile without reading a package or starting Docker.
      responses:
        '200':
          description: Runtime gate status.
        default:
          $ref: '#/components/responses/Error'
  /local/external-skills/packages:
    servers:
      - url: /api
    get:
      operationId: listExternalSkillPackages
      responses:
        '200':
          description: Immutable registered package summaries and runtime status.
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: registerExternalSkillPackage
      description: Registers an unexecuted local ZIP containing only manifest.json and entry.py.
      parameters:
        - name: source_label
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 160
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Package registered with immutable content digest.
        default:
          $ref: '#/components/responses/Error'
  /local/external-skills/packages/{packageId}:execute:
    servers:
      - url: /api
    post:
      operationId: executeExternalSkillPackage
      description: Runs a registered package only after the explicit runtime gate in a one-shot no-network container.
      parameters:
        - name: packageId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './external-skill-runtime.schema.json#/$defs/execution_request'
      responses:
        '200':
          description: Bounded JSON result and isolated-execution audit summary.
          content:
            application/json:
              schema:
                $ref: './external-skill-runtime.schema.json#/$defs/execution_result'
        default:
          $ref: '#/components/responses/Error'
  /local/memory/runtime:
    servers:
      - url: /api
    get:
      operationId: getMemoryPlaneRuntime
      description: Returns the local M1 Memory Plane capability boundary. It does not extract or write memory.
      responses:
        '200':
          description: M1 runtime state.
        default:
          $ref: '#/components/responses/Error'
  /local/memory/banks:
    servers:
      - url: /api
    get:
      operationId: listMemoryBanks
      responses:
        '200':
          description: Local-admin memory banks and M1 status.
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createMemoryBank
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './memory-plane.schema.json#/$defs/bank_create_request'
      responses:
        '201':
          description: A bank with a fixed local ownership and policy boundary.
          content:
            application/json:
              schema:
                $ref: './memory-plane.schema.json#/$defs/memory_bank'
        default:
          $ref: '#/components/responses/Error'
  /local/memory/banks/{bankId}/retain:
    servers:
      - url: /api
    post:
      operationId: retainMemoryEvidence
      description: Explicitly stores a bounded Source Evidence and its caller-supplied atomic Facts. It never performs model extraction.
      parameters:
        - name: bankId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './memory-plane.schema.json#/$defs/retain_request'
      responses:
        '201':
          description: Source/Facts retained or an existing source deduplicated.
        default:
          $ref: '#/components/responses/Error'
  /local/memory/banks/{bankId}/entities:
    servers:
      - url: /api
    post:
      operationId: retainMemoryGraphEntity
      description: Explicitly records an Entity backed by one active Fact in the same Bank. It performs no automatic extraction or name resolution.
      parameters:
        - name: bankId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './memory-graph.schema.json#/$defs/entity_input'
      responses:
        '201':
          description: Explicit entity and audit reference.
          content:
            application/json:
              schema:
                $ref: './memory-graph.schema.json#/$defs/entity_create_result'
        default:
          $ref: '#/components/responses/Error'
  /local/memory/banks/{bankId}/relations:
    servers:
      - url: /api
    post:
      operationId: retainMemoryGraphRelation
      description: Explicitly records a directed same-Bank Relation supported by one active Fact. It performs no graph inference.
      parameters:
        - name: bankId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './memory-graph.schema.json#/$defs/relation_input'
      responses:
        '201':
          description: Explicit relation and audit reference.
          content:
            application/json:
              schema:
                $ref: './memory-graph.schema.json#/$defs/relation_create_result'
        default:
          $ref: '#/components/responses/Error'
  /local/memory/banks/{bankId}:recall:
    servers:
      - url: /api
    post:
      operationId: recallMemoryEvidence
      description: Read-back only. Applies bank, status, retention and validity filters then deterministic keyword/temporal ranking.
      parameters:
        - name: bankId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './memory-plane.schema.json#/$defs/recall_request'
      responses:
        '200':
          description: Bounded Evidence Bundle without raw Source content.
          content:
            application/json:
              schema:
                $ref: './memory-plane.schema.json#/$defs/evidence_bundle'
        default:
          $ref: '#/components/responses/Error'
  /local/memory/banks/{bankId}:context:
    servers:
      - url: /api
    post:
      operationId: buildMemoryContextCapsule
      description: Returns caller-provided transient recent turns plus a Fact-derived Capsule and a bounded detail catalog. It does not persist turns, read raw Source content, or call a model.
      parameters:
        - name: bankId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './memory-context.schema.json#/$defs/context_request'
      responses:
        '200':
          description: Bounded model-readable Fact Capsule with no raw Source content.
          content:
            application/json:
              schema:
                $ref: './memory-context.schema.json#/$defs/context_capsule'
        default:
          $ref: '#/components/responses/Error'
  /local/memory/banks/{bankId}:recall-details:
    servers:
      - url: /api
    post:
      operationId: recallMemoryDetails
      description: Re-validates selected Fact IDs from a capsule catalog and returns their bounded explicit details and source references, never raw Source content.
      parameters:
        - name: bankId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './memory-context.schema.json#/$defs/detail_recall_request'
      responses:
        '200':
          description: Exact selected details after bank/status/time revalidation.
          content:
            application/json:
              schema:
                $ref: './memory-context.schema.json#/$defs/detail_bundle'
        default:
          $ref: '#/components/responses/Error'
  /local/memory/banks/{bankId}:graph-recall:
    servers:
      - url: /api
    post:
      operationId: recallMemoryGraphEvidence
      description: Traverses at most two explicit, source-backed relations from a known Entity ID after Bank/status/time revalidation. It is not natural-language GraphQA.
      parameters:
        - name: bankId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './memory-graph.schema.json#/$defs/graph_recall_request'
      responses:
        '200':
          description: Bounded graph evidence paths without raw Source content.
          content:
            application/json:
              schema:
                $ref: './memory-graph.schema.json#/$defs/graph_evidence_bundle'
        default:
          $ref: '#/components/responses/Error'
  /local/memory/banks/{bankId}:resolve-entity:
    servers:
      - url: /api
    post:
      operationId: resolveMemoryGraphEntity
      description: Exact casefold lookup of an active same-Bank canonical name or alias. It never resolves ambiguity automatically and does not perform natural-language Entity Resolution.
      parameters:
        - name: bankId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './memory-entity-catalog.schema.json#/$defs/entity_resolve_request'
      responses:
        '200':
          description: Exact Entity candidate(s), ambiguity status and explicit Graph handoff.
          content:
            application/json:
              schema:
                $ref: './memory-entity-catalog.schema.json#/$defs/entity_resolution'
        default:
          $ref: '#/components/responses/Error'
  /local/memory/banks/{bankId}:fact-lineage:
    servers:
      - url: /api
    post:
      operationId: recallMemoryFactLineage
      description: Returns a bounded explicit supersede history for a known Fact ID. It does not perform natural-language conflict resolution.
      parameters:
        - name: bankId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './memory-fact-lineage.schema.json#/$defs/request'
      responses:
        '200':
          description: Current/historical Fact evidence without Source content.
          content:
            application/json:
              schema:
                $ref: './memory-fact-lineage.schema.json#/$defs/bundle'
        default:
          $ref: '#/components/responses/Error'
  /local/memory/sources/{sourceId}:retract:
    servers:
      - url: /api
    post:
      operationId: retractMemorySource
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Source and active dependent Facts retracted.
        default:
          $ref: '#/components/responses/Error'
  /local/memory/sources/{sourceId}:
    servers:
      - url: /api
    delete:
      operationId: deleteMemorySource
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Deletes Source/Facts from the canonical local store and leaves a no-content tombstone/audit record.
        default:
          $ref: '#/components/responses/Error'
  /local/team/runtime:
    servers:
      - url: /api
    get:
      operationId: getLocalTeamCoordinationRuntime
      description: Returns the local Team Task/Handoff/Gate boundary. It never starts an Agent, model or external tool.
      responses:
        '200':
          description: Local deterministic coordination runtime status.
          content:
            application/json:
              schema:
                $ref: './team-coordination.schema.json#/$defs/runtime_status'
        default:
          $ref: '#/components/responses/Error'
  /local/team/foundation/runtime:
    servers:
      - url: /api
    get:
      operationId: getTeamFoundationRuntime
      description: Returns the local protocol identity and Channel boundary. It is not HTTP authentication or an Agent runtime.
      responses:
        '200':
          description: Fixed-zero Team Foundation boundary status.
          content:
            application/json:
              schema:
                $ref: './team-foundation.schema.json#/$defs/runtime_status'
        default:
          $ref: '#/components/responses/Error'
  /local/team/attention/runtime:
    servers:
      - url: /api
    get:
      operationId: getTeamAttentionRuntime
      description: Returns the local metadata-only Inbox/freshness boundary. It never sends messages or starts an Agent, model or tool.
      responses:
        '200':
          description: Fixed-zero Team Attention runtime status.
          content:
            application/json:
              schema:
                $ref: './team-attention.schema.json#/$defs/runtime_status'
        default:
          $ref: '#/components/responses/Error'
  /local/team/inbox:
    servers:
      - url: /api
    get:
      operationId: getTeamInbox
      parameters:
        - name: actor_id
          in: query
          required: true
          schema:
            $ref: './team-attention.schema.json#/$defs/agent_id'
      responses:
        '200':
          description: Authorized attention and work-mark metadata for one protocol identity, without message content.
          content:
            application/json:
              schema:
                $ref: './team-attention.schema.json#/$defs/inbox_list'
        default:
          $ref: '#/components/responses/Error'
  /local/team/attention/items:
    servers:
      - url: /api
    post:
      operationId: createTeamAttentionItem
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './team-attention.schema.json#/$defs/attention_item_create_request'
      responses:
        '201':
          description: Metadata-only attention item with server-derived priority, sequence and open work mark.
          content:
            application/json:
              schema:
                $ref: './team-attention.schema.json#/$defs/attention_mutation_result'
        default:
          $ref: '#/components/responses/Error'
  /local/team/attention/items/{itemId}:claim:
    servers:
      - url: /api
    post:
      operationId: claimTeamAttentionItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './team-attention.schema.json#/$defs/attention_claim_request'
      responses:
        '200':
          description: One protocol identity has atomically claimed one attention work item.
          content:
            application/json:
              schema:
                $ref: './team-attention.schema.json#/$defs/attention_mutation_result'
        default:
          $ref: '#/components/responses/Error'
  /local/team/attention/items/{itemId}:release:
    servers:
      - url: /api
    post:
      operationId: releaseTeamAttentionItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './team-attention.schema.json#/$defs/attention_release_request'
      responses:
        '200':
          description: Releases the attention lease while retaining an open work mark.
          content:
            application/json:
              schema:
                $ref: './team-attention.schema.json#/$defs/attention_mutation_result'
        default:
          $ref: '#/components/responses/Error'
  /local/team/attention/items/{itemId}:complete:
    servers:
      - url: /api
    post:
      operationId: completeTeamAttentionItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './team-attention.schema.json#/$defs/attention_complete_request'
      responses:
        '200':
          description: Completes an item only after an active lease and latest read sequence match.
          content:
            application/json:
              schema:
                $ref: './team-attention.schema.json#/$defs/attention_mutation_result'
        default:
          $ref: '#/components/responses/Error'
  /local/team/channels/{channelId}/threads/{threadId}:read:
    servers:
      - url: /api
    post:
      operationId: updateTeamThreadReadCursor
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            $ref: './team-attention.schema.json#/$defs/channel_id'
        - name: threadId
          in: path
          required: true
          schema:
            $ref: './team-attention.schema.json#/$defs/thread_id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './team-attention.schema.json#/$defs/read_cursor_update_request'
      responses:
        '200':
          description: Records the latest observed metadata sequence for the current protocol identity.
          content:
            application/json:
              schema:
                $ref: './team-attention.schema.json#/$defs/read_cursor_result'
        default:
          $ref: '#/components/responses/Error'
  /local/team/sessions/runtime:
    servers:
      - url: /api
    get:
      operationId: getTeamSessionContinuityRuntime
      description: Returns the metadata-only Team Session continuity boundary; no Agent Runtime, telemetry, model, tool, message history or automatic rotation is connected.
      responses:
        '200':
          description: Fixed-zero Team Session continuity runtime status.
          content:
            application/json:
              schema:
                $ref: './team-session-continuity.schema.json#/$defs/runtime_status'
        default:
          $ref: '#/components/responses/Error'
  /local/team/sessions:
    servers:
      - url: /api
    get:
      operationId: listTeamSessions
      parameters:
        - name: actor_id
          in: query
          required: true
          schema:
            $ref: './team-session-continuity.schema.json#/$defs/agent_id'
        - name: channel_id
          in: query
          required: false
          schema:
            $ref: './team-session-continuity.schema.json#/$defs/channel_id'
      responses:
        '200':
          description: Sessions owned by the current protocol identity in authorized Channels.
          content:
            application/json:
              schema:
                $ref: './team-session-continuity.schema.json#/$defs/session_list'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createTeamSession
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './team-session-continuity.schema.json#/$defs/session_create_request'
      responses:
        '201':
          description: A new active Team Session with a server-generated current continuity snapshot.
          content:
            application/json:
              schema:
                $ref: './team-session-continuity.schema.json#/$defs/session_create_result'
        default:
          $ref: '#/components/responses/Error'
  /local/team/sessions/{sessionId}:
    servers:
      - url: /api
    get:
      operationId: getTeamSession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            $ref: './team-session-continuity.schema.json#/$defs/session_id'
        - name: actor_id
          in: query
          required: true
          schema:
            $ref: './team-session-continuity.schema.json#/$defs/agent_id'
      responses:
        '200':
          description: One owned Session, freshly generated continuity snapshot and optional inherited handoff.
          content:
            application/json:
              schema:
                $ref: './team-session-continuity.schema.json#/$defs/session_detail'
        default:
          $ref: '#/components/responses/Error'
  /local/team/sessions/{sessionId}:handoff:
    servers:
      - url: /api
    post:
      operationId: handoffTeamSession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
