openapi: 3.1.0
info:
  title: HarnessAgent P0 API
  version: 0.1.0-draft
  description: Draft API for the controlled CodeAct data-analysis vertical slice.
servers:
  - url: /api/v1
paths:
  /local/external-skills/runtime:
    servers:
      - url: /api
    get:
      operationId: getExternalSkillRuntime
      description: Returns the default-closed external Skill gate and isolation profile without reading a package or starting Docker.
      responses:
        '200':
          description: Runtime gate status.
        default:
          $ref: '#/components/responses/Error'
  /local/external-skills/packages:
    servers:
      - url: /api
    get:
      operationId: listExternalSkillPackages
      responses:
        '200':
          description: Immutable registered package summaries and runtime status.
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: registerExternalSkillPackage
      description: Registers an unexecuted local ZIP containing only manifest.json and entry.py.
      parameters:
        - name: source_label
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 160
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Package registered with immutable content digest.
        default:
          $ref: '#/components/responses/Error'
  /local/external-skills/packages/{packageId}:execute:
    servers:
      - url: /api
    post:
      operationId: executeExternalSkillPackage
      description: Runs a registered package only after the explicit runtime gate in a one-shot no-network container.
      parameters:
        - name: packageId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './external-skill-runtime.schema.json#/$defs/execution_request'
      responses:
        '200':
          description: Bounded JSON result and isolated-execution audit summary.
          content:
            application/json:
              schema:
                $ref: './external-skill-runtime.schema.json#/$defs/execution_result'
        default:
          $ref: '#/components/responses/Error'
  /local/memory/runtime:
    servers:
      - url: /api
    get:
      operationId: getMemoryPlaneRuntime
      description: Returns the local M1 Memory Plane capability boundary. It does not extract or write memory.
      responses:
        '200':
          description: M1 runtime state.
        default:
          $ref: '#/components/responses/Error'
  /local/memory/banks:
    servers:
      - url: /api
    get:
      operationId: listMemoryBanks
      responses:
        '200':
          description: Local-admin memory banks and M1 status.
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createMemoryBank
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './memory-plane.schema.json#/$defs/bank_create_request'
      responses:
        '201':
          description: A bank with a fixed local ownership and policy boundary.
          content:
            application/json:
              schema:
                $ref: './memory-plane.schema.json#/$defs/memory_bank'
        default:
          $ref: '#/components/responses/Error'
  /local/memory/banks/{bankId}/retain:
    servers:
      - url: /api
    post:
      operationId: retainMemoryEvidence
      description: Explicitly stores a bounded Source Evidence and its caller-supplied atomic Facts. It never performs model extraction.
      parameters:
        - name: bankId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './memory-plane.schema.json#/$defs/retain_request'
      responses:
        '201':
          description: Source/Facts retained or an existing source deduplicated.
        default:
          $ref: '#/components/responses/Error'
  /local/memory/banks/{bankId}/entities:
    servers:
      - url: /api
    post:
      operationId: retainMemoryGraphEntity
      description: Explicitly records an Entity backed by one active Fact in the same Bank. It performs no automatic extraction or name resolution.
      parameters:
        - name: bankId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './memory-graph.schema.json#/$defs/entity_input'
      responses:
        '201':
          description: Explicit entity and audit reference.
          content:
            application/json:
              schema:
                $ref: './memory-graph.schema.json#/$defs/entity_create_result'
        default:
          $ref: '#/components/responses/Error'
  /local/memory/banks/{bankId}/relations:
    servers:
      - url: /api
    post:
      operationId: retainMemoryGraphRelation
      description: Explicitly records a directed same-Bank Relation supported by one active Fact. It performs no graph inference.
      parameters:
        - name: bankId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './memory-graph.schema.json#/$defs/relation_input'
      responses:
        '201':
          description: Explicit relation and audit reference.
          content:
            application/json:
              schema:
                $ref: './memory-graph.schema.json#/$defs/relation_create_result'
        default:
          $ref: '#/components/responses/Error'
  /local/memory/banks/{bankId}:recall:
    servers:
      - url: /api
    post:
      operationId: recallMemoryEvidence
      description: Read-back only. Applies bank, status, retention and validity filters then deterministic keyword/temporal ranking.
      parameters:
        - name: bankId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './memory-plane.schema.json#/$defs/recall_request'
      responses:
        '200':
          description: Bounded Evidence Bundle without raw Source content.
          content:
            application/json:
              schema:
                $ref: './memory-plane.schema.json#/$defs/evidence_bundle'
        default:
          $ref: '#/components/responses/Error'
  /local/memory/banks/{bankId}:context:
    servers:
      - url: /api
    post:
      operationId: buildMemoryContextCapsule
      description: Returns caller-provided transient recent turns plus a Fact-derived Capsule and a bounded detail catalog. It does not persist turns, read raw Source content, or call a model.
      parameters:
        - name: bankId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './memory-context.schema.json#/$defs/context_request'
      responses:
        '200':
          description: Bounded model-readable Fact Capsule with no raw Source content.
          content:
            application/json:
              schema:
                $ref: './memory-context.schema.json#/$defs/context_capsule'
        default:
          $ref: '#/components/responses/Error'
  /local/memory/banks/{bankId}:recall-details:
    servers:
      - url: /api
    post:
      operationId: recallMemoryDetails
      description: Re-validates selected Fact IDs from a capsule catalog and returns their bounded explicit details and source references, never raw Source content.
      parameters:
        - name: bankId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './memory-context.schema.json#/$defs/detail_recall_request'
      responses:
        '200':
          description: Exact selected details after bank/status/time revalidation.
          content:
            application/json:
              schema:
                $ref: './memory-context.schema.json#/$defs/detail_bundle'
        default:
          $ref: '#/components/responses/Error'
  /local/memory/banks/{bankId}:graph-recall:
    servers:
      - url: /api
    post:
      operationId: recallMemoryGraphEvidence
      description: Traverses at most two explicit, source-backed relations from a known Entity ID after Bank/status/time revalidation. It is not natural-language GraphQA.
      parameters:
        - name: bankId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './memory-graph.schema.json#/$defs/graph_recall_request'
      responses:
        '200':
          description: Bounded graph evidence paths without raw Source content.
          content:
            application/json:
              schema:
                $ref: './memory-graph.schema.json#/$defs/graph_evidence_bundle'
        default:
          $ref: '#/components/responses/Error'
  /local/memory/banks/{bankId}:resolve-entity:
    servers:
      - url: /api
    post:
      operationId: resolveMemoryGraphEntity
      description: Exact casefold lookup of an active same-Bank canonical name or alias. It never resolves ambiguity automatically and does not perform natural-language Entity Resolution.
      parameters:
        - name: bankId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './memory-entity-catalog.schema.json#/$defs/entity_resolve_request'
      responses:
        '200':
          description: Exact Entity candidate(s), ambiguity status and explicit Graph handoff.
          content:
            application/json:
              schema:
                $ref: './memory-entity-catalog.schema.json#/$defs/entity_resolution'
        default:
          $ref: '#/components/responses/Error'
  /local/memory/banks/{bankId}:fact-lineage:
    servers:
      - url: /api
    post:
      operationId: recallMemoryFactLineage
      description: Returns a bounded explicit supersede history for a known Fact ID. It does not perform natural-language conflict resolution.
      parameters:
        - name: bankId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './memory-fact-lineage.schema.json#/$defs/request'
      responses:
        '200':
          description: Current/historical Fact evidence without Source content.
          content:
            application/json:
              schema:
                $ref: './memory-fact-lineage.schema.json#/$defs/bundle'
        default:
          $ref: '#/components/responses/Error'
  /local/memory/sources/{sourceId}:retract:
    servers:
      - url: /api
    post:
      operationId: retractMemorySource
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Source and active dependent Facts retracted.
        default:
          $ref: '#/components/responses/Error'
  /local/memory/sources/{sourceId}:
    servers:
      - url: /api
    delete:
      operationId: deleteMemorySource
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Deletes Source/Facts from the canonical local store and leaves a no-content tombstone/audit record.
        default:
          $ref: '#/components/responses/Error'
  /local/team/runtime:
    servers:
      - url: /api
    get:
      operationId: getLocalTeamCoordinationRuntime
      description: Returns the local Team Task/Handoff/Gate boundary. It never starts an Agent, model or external tool.
      responses:
        '200':
          description: Local deterministic coordination runtime status.
          content:
            application/json:
              schema:
                $ref: './team-coordination.schema.json#/$defs/runtime_status'
        default:
          $ref: '#/components/responses/Error'
  /local/team/tasks:
    servers:
      - url: /api
    get:
      operationId: listLocalTeamTasks
      responses:
        '200':
          description: Team Task summaries and local coordination boundary.
          content:
            application/json:
              schema:
                $ref: './team-coordination.schema.json#/$defs/team_task_list'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createLocalTeamTask
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './team-coordination.schema.json#/$defs/team_task_create_request'
      responses:
        '201':
          description: A Team Task with frozen requirements, scope, stop conditions and Gate.
          content:
            application/json:
              schema:
                $ref: './team-coordination.schema.json#/$defs/team_task'
        default:
          $ref: '#/components/responses/Error'
  /local/team/tasks/{taskId}:
    servers:
      - url: /api
    get:
      operationId: getLocalTeamTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One Team Task with append-only Handoffs and Gate decisions.
          content:
            application/json:
              schema:
                $ref: './team-coordination.schema.json#/$defs/team_task_detail'
        default:
          $ref: '#/components/responses/Error'
  /local/team/tasks/{taskId}:claim:
    servers:
      - url: /api
    post:
      operationId: claimLocalTeamTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './team-coordination.schema.json#/$defs/claim_request'
      responses:
        '200':
          description: Atomically claimed Team Task and execution lease.
          content:
            application/json:
              schema:
                $ref: './team-coordination.schema.json#/$defs/team_task'
        default:
          $ref: '#/components/responses/Error'
  /local/team/tasks/{taskId}/handoffs:
    servers:
      - url: /api
    post:
      operationId: appendLocalTeamTaskHandoff
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './team-coordination.schema.json#/$defs/handoff_create_request'
      responses:
        '201':
          description: Append-only Handoff bound to the current Task requirements and Gate digests.
          content:
            application/json:
              schema:
                $ref: './team-coordination.schema.json#/$defs/handoff_result'
        default:
          $ref: '#/components/responses/Error'
  /local/team/tasks/{taskId}:submit:
    servers:
      - url: /api
    post:
      operationId: submitLocalTeamTaskForGate
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './team-coordination.schema.json#/$defs/submit_request'
      responses:
        '200':
          description: Task submitted to review after Handoff and Child Task checks.
          content:
            application/json:
              schema:
                $ref: './team-coordination.schema.json#/$defs/team_task'
        default:
          $ref: '#/components/responses/Error'
  /local/team/tasks/{taskId}:close:
    servers:
      - url: /api
    post:
      operationId: closeLocalTeamTask
      summary: Stop tracking a Team Task without accepting it as delivered
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './team-coordination.schema.json#/$defs/close_request'
      responses:
        '200':
          description: Task is closed for tracking and does not represent a Gate pass.
          content:
            application/json:
              schema:
                $ref: './team-coordination.schema.json#/$defs/team_task'
        default:
          $ref: '#/components/responses/Error'
  /local/team/tasks/{taskId}/gate-decisions:
    servers:
      - url: /api
    post:
      operationId: decideLocalTeamTaskGate
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './team-coordination.schema.json#/$defs/gate_decision_request'
      responses:
        '201':
          description: Append-only Gate decision and resulting Task state.
          content:
            application/json:
              schema:
                $ref: './team-coordination.schema.json#/$defs/gate_decision_result'
        default:
          $ref: '#/components/responses/Error'
  /tasks:
    post:
      operationId: createTask
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '202':
          description: Task and initial Run accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTaskResponse'
        default:
          $ref: '#/components/responses/Error'
  /tasks/{taskId}:
    get:
      operationId: getTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Immutable Task with derived latest Run summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        default:
          $ref: '#/components/responses/Error'
  /tasks/{taskId}/runs:
    post:
      operationId: createRun
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                based_on_run_id:
                  type: [string, 'null']
                reason:
                  enum: [retry, rerun]
      responses:
        '202':
          description: New Run accepted without modifying earlier Run terminal state.
          content:
            application/json:
              schema:
                $ref: './core-contracts.schema.json#/$defs/run'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runId}:
    get:
      operationId: getRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run snapshot.
          content:
            application/json:
              schema:
                $ref: './core-contracts.schema.json#/$defs/run'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runId}:cancel:
    post:
      operationId: cancelRun
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Cancellation requested.
        default:
          $ref: '#/components/responses/Error'
  /local/runs/{runId}/restore:
    servers:
      - url: /api
    get:
      operationId: getLocalCheckpointRestoreEligibility
      description: ADR-0018 only. Read-only eligibility for the fixed same-Task restore path.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Current restore eligibility without a state change.
          content:
            application/json:
              schema:
                $ref: './local-checkpoint-restore.schema.json#/$defs/restore_status'
        default:
          $ref: '#/components/responses/Error'
  /local/runs/{runId}:restore:
    servers:
      - url: /api
    post:
      operationId: restoreLocalCheckpoint
      description: ADR-0018 only. Body is empty; Task, resource, policy, limits and adapter come exclusively from the persisted checkpoint.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './local-checkpoint-restore.schema.json#/$defs/restore_request'
      responses:
        '202':
          description: One bound fixed recovery Run queued.
          content:
            application/json:
              schema:
                $ref: './local-checkpoint-restore.schema.json#/$defs/restore_response'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runId}/replans:
    get:
      operationId: listLocalReplans
      description: ADR-0019 only. Lists control-plane summaries; it never creates a Run.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: ReplanAttempt summaries for one origin Run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplanList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: proposeLocalDeterministicReplan
      description: >-
        ADR-0019 only. The body is empty. The controller, not the caller, derives the
        only candidate Plan from an ARTIFACT_PUBLICATION_FAILED Event and a verified checkpoint.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObject'
      responses:
        '201':
          description: Fixed candidate ReplanAttempt proposed; no recovery Run is created.
          content:
            application/json:
              schema:
                $ref: './local-replan.schema.json#/$defs/replan_created'
        default:
          $ref: '#/components/responses/Error'
  /replans/{replanId}:
    get:
      operationId: getLocalReplan
      parameters:
        - $ref: '#/components/parameters/ReplanId'
      responses:
        '200':
          description: Persisted Attempt and its immutable candidate PlanRevision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplanDetail'
        default:
          $ref: '#/components/responses/Error'
  /replans/{replanId}:try:
    post:
      operationId: tryLocalDeterministicReplan
      description: No adapter, tool, model, network, or Product Run side effect is allowed.
      parameters:
        - $ref: '#/components/parameters/ReplanId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObject'
      responses:
        '200':
          description: Compatibility checked; only awaiting_confirmation is confirmable.
          content:
            application/json:
              schema:
                $ref: './local-replan.schema.json#/$defs/replan_try_result'
        default:
          $ref: '#/components/responses/Error'
  /replans/{replanId}:confirm:
    post:
      operationId: confirmLocalDeterministicReplan
      description: Compare-and-swap of Try-bound Plan, checkpoint, Task, resource, adapter, policy and remaining limits.
      parameters:
        - $ref: '#/components/parameters/ReplanId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObject'
      responses:
        '202':
          description: One new bound recovery Run queued.
          content:
            application/json:
              schema:
                $ref: './local-replan.schema.json#/$defs/replan_confirmed'
        default:
          $ref: '#/components/responses/Error'
  /replans/{replanId}:cancel:
    post:
      operationId: cancelLocalDeterministicReplan
      description: Cancels only an unconfirmed Attempt; source Run and checkpoint are unchanged.
      parameters:
        - $ref: '#/components/parameters/ReplanId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObject'
      responses:
        '200':
          description: Attempt cancelled without a recovery Run.
          content:
            application/json:
              schema:
                $ref: './local-replan.schema.json#/$defs/replan_cancelled'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runId}/events:
    get:
      operationId: streamRunEvents
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Ordered Server-Sent Events for one Run.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /approvals/{approvalId}:decide:
    post:
      operationId: decideApproval
      parameters:
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, reason]
              properties:
                decision:
                  enum: [approved, rejected]
                reason:
                  type: string
                  minLength: 1
                constraints:
                  type: object
                  additionalProperties: false
                  required: [expires_at, max_uses]
                  properties:
                    expires_at:
                      type: string
                      format: date-time
                    max_uses:
                      type: integer
                      minimum: 1
      responses:
        '200':
          description: Approval decided; an approved Run is automatically redispatched.
          content:
            application/json:
              schema:
                $ref: './core-contracts.schema.json#/$defs/approval'
        default:
          $ref: '#/components/responses/Error'
  /local/agent-lab/providers:
    servers: [{url: /api}]
    get:
      operationId: listLocalAgentLabProviders
