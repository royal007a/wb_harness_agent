<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>智能客服 · HarnessAgent</title><link rel="stylesheet" href="/static/support.css"></head>
<body><header><a href="/">HarnessAgent</a><h1>智能客服工作台</h1><span id="runtime">读取服务状态…</span></header>
<p class="notice">单管理员内测 · 仅输入公开或合成资料 · 回答须人工核对。API Key 加密入库，不向模型或浏览器回显。</p>
<nav aria-label="模块"><button data-tab="chat">客服对话</button><button data-tab="agents">Agent</button><button data-tab="providers">模型与凭证</button></nav>
<p id="status" role="status" aria-live="polite"></p>
<main>
<section id="chat" class="tab"><div class="chat-layout"><aside>
<label>选择 Agent<select id="chat-agent"></select></label><button id="new-session">新建会话</button>
<div id="sessions" aria-label="历史会话"></div></aside><div>
<h2 id="session-title">选择或创建会话</h2><div id="messages" role="log" aria-live="polite"></div>
<form id="chat-form"><label for="question">发送消息</label><textarea id="question" rows="3" maxlength="8000" required placeholder="例如：你们的退款流程是什么？"></textarea>
<div class="actions"><button id="send" type="submit">发送</button><button id="stop" type="button" disabled>停止</button></div></form>
</div></div></section>
<section id="agents" class="tab" hidden><h2>Agent 配置</h2><div id="agent-list" class="cards"></div>
<form id="agent-form"><input id="agent-id" type="hidden"><label>名称<input id="agent-name" required maxlength="100"></label>
<label>Provider<select id="agent-provider" required></select></label><label>模型 ID<input id="agent-model" placeholder="留空使用 Provider 默认模型"></label>
<label>System Prompt<textarea id="agent-prompt" rows="5" maxlength="8000" required>你是客服助手。根据知识库回答，不知道时如实说明，必要时建议联系人工客服。</textarea></label>
<label>单轮输出上限<input id="agent-output" type="number" min="32" max="8192" value="2048"></label>
<label>每次消息总 Token 预算<input id="agent-budget" type="number" min="1" max="20000000" value="20000000"></label>
<label><input id="agent-enabled" type="checkbox" checked>启用</label><button type="submit">保存 Agent</button><button type="button" id="agent-reset">新建配置</button>
</form><p>已有会话使用创建时的 Agent 配置快照；修改配置后请新建会话。停用立即阻止后续模型请求。</p></section>
<section id="providers" class="tab" hidden><h2>模型与凭证</h2><div id="provider-list" class="cards"></div>
<form id="provider-form"><input id="provider-id" type="hidden"><label>名称<input id="provider-name" required maxlength="100"></label>
<label>Base URL<input id="provider-url" type="url" required value="https://ark.cn-beijing.volces.com/api/coding/v3"></label>
<label>默认模型<input id="provider-model" required value="doubao-seed-2.1-lite"></label>
<label>API Key（更新时留空保留）<input id="provider-key" type="password" autocomplete="new-password" maxlength="2048"></label>
<label><input id="provider-enabled" type="checkbox" checked>启用 Provider</label>
<label><input id="provider-auto" type="checkbox" checked>自动联网探测（固定公开提示，可能消耗套餐额度）</label>
<label>探测间隔（秒）<input id="provider-interval" type="number" min="300" max="86400" value="900"></label>
<button type="submit">加密保存</button><button type="button" id="provider-reset">新建配置</button></form>
<p>每个 Provider 每日最多96次手工/自动探测，单次输出最多32 Token。公网 HTTP 不允许上传 Key，请使用 HTTPS 或 SSH 隧道。</p></section>
</main><script src="/static/support.js"></script></body></html>
